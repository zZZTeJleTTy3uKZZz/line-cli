# Манифест навыка line для Skillery. Нативный Go-CLI: Python-пакета и шима нет.
description = "Go-клиент «Линии» (омниканальный шлюз): агент читает и пишет в Telegram, MAX и WhatsApp по API-ключу — диалоги, лента, отправка с файлами, вложения, поиск контакта, ссылка входа для подключения нового аккаунта."
version = "0.1.5"
kind = "tooling"
triggers = [
    "прочитай чат",
    "напиши в телеграм",
    "отправь сообщение в макс",
    "список диалогов",
    "подключи аккаунт телеграм",
    "api линии",
    "read telegram chat",
    "send max message",
    "line cli",
    "omnichannel gateway",
]
tags = ["messengers", "telegram", "max", "whatsapp", "cli", "native-go"]
# Бинарник line: хаб принимает runtime-зависимости только pip/npm/system, поэтому он объявлен как system
# (skillkit сам его не ставит, а печатает инструкцию); ставит установщик навыка install/install.sh|ps1
# из публичного GitHub Release (первый шаг онбординга) в ~/.local/bin.
runtime_dependencies = [
    { kind = "system", spec = "line" },
]

# Нативный бинарник: команда `line` лежит в ~/.local/bin (её кладёт установщик навыка), шим указывает на неё.
[[cli]]
command_name = "line"
entrypoint = "~/.local/bin/line"

[onboarding]
summary = "line — нативный Go-клиент API «Линии». Навык даёт инструкции и установщик бинарника; ключ API выдаётся входом устройства (`line auth login`), хранится в связке ключей ОС или в ~/.config/line/<профиль>.key и в навык не входит."
next_steps = [
    "REQUIRED: проверь `line --version` (ожидается 0.1.5 или новее). Нет бинарника или версия старее — запусти установщик навыка: `bash ~/.claude/skills/line/install/install.sh` (Linux, WSL, macOS; путь к навыку — каталог, куда он установлен) или `powershell -ExecutionPolicy Bypass -File <каталог навыка>\\install\\install.ps1` (Windows). Он качает бинарник из публичного GitHub Release с проверкой SHA256SUMS в ~/.local/bin; нужен только curl/tar (Windows — PowerShell). Если `line` не находится — добавь ~/.local/bin в PATH и открой новый терминал.",
    "REQUIRED: войди с этого устройства: `line auth login` (профиль — `--profile <имя>`). Команда напечатает ссылку и код и откроет браузер; руководитель компании жмёт «Разрешить» в кабинете, ключ сохраняется сам. Ключ в беседу не вставлять.",
    "REQUIRED: `line auth status` — ключ принят; `line connection list --text` — есть подключённый аккаунт.",
    "OPTIONAL: нет аккаунта — `line auth login --rights read,send,admin`, затем `line connection add telegram` и передай login_link.url владельцу (references/connect-account.md).",
    "OPTIONAL: вход через кабинет недоступен — ключ у владельца: `printf '%s' \"$KEY\" | line auth set --profile <имя>`.",
]
docs = "Команды и флаги: line --help, references/commands.md."
